# cargo-about's configuration for THIRD-PARTY-LICENSES.html, which
# build-matrix.yml generates and puts in every release archive: the licence
# texts and copyright notices of the code compiled into the binaries.

# deny.toml's [licenses] allow list, which vets what may enter the graph; the
# two move together. Here the order matters: it picks which side of an OR
# expression is printed. The ids after the blank line come only from the
# clarifications below, which deny.toml cannot see.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-or-later",

    "Bitstream-Vera",
    "LGPL-2.1-or-later",
    "Unicode-DFS-2016",
]
# The six targets build-matrix.yml ships, as in deny.toml: one file for every
# archive.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Build dependencies stay in: a code generator's output can reach the binary,
# like gl_generator's bindings from khronos_api's Khronos registry.
ignore-dev-dependencies = true
# Our own publish = false crates; LICENSE covers them.
private = { ignore = true }

# The clarifications below name licence files a crate's metadata leaves out.
# Each file (or its start..end slice) is pinned by sha256 checksum. When a
# crate update changes one, cargo-about drops the clarification with a warning,
# which build-matrix.yml turns into a failure: re-read the file, then update
# the entry.

# The C hidapi library the crate compiles in is offered under GPL-3.0, a BSD
# licence or its original licence; we take the BSD one.
[hidapi.clarify]
license = "MIT AND BSD-3-Clause"

[[hidapi.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "778d971f6152990cee1644e7aadcd51a68050dd73f76463c5a9c1863ca495d73"

[[hidapi.clarify.files]]
path = "etc/hidapi/LICENSE-bsd.txt"
license = "BSD-3-Clause"
checksum = "30eb1bef29b46f8ba7ab8b416035dbd93cb034a45481dd97815b944284582cd2"

