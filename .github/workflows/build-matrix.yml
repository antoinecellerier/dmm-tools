# Shared binary build, called by release.yml (tagged releases), dev-build.yml
# (nightly prereleases) and ci.yml (the push/pull-request smoke build). Keeping
# all three on one matrix means a nightly build exercises the exact packaging
# path that later cuts a release -- a break surfaces the next morning instead of
# at tag time -- and CI cannot drift from the targets a release ships.
name: Build binaries

on:
  workflow_call:
    inputs:
      archive-prefix:
        description: "Base name for the archives, e.g. dmm-tools-v0.8.0 or dmm-tools-v0.9.0-dev-abc1234"
        type: string
        default: dmm-tools
      subset:
        description: "Targets to build: all (the six release targets) or ci (the three smoke targets)"
        type: string
        default: all
      upload-artifacts:
        description: "Package and upload the binaries; off for builds that only need to compile"
        type: boolean
        default: true
      cache:
        description: "Restore and save Swatinem/rust-cache; on for CI, off for unattended builds"
        type: boolean
        default: false
      published:
        description: "Mark the binaries as a published build, so dmm-gui checks GitHub for newer ones, and build them with fat LTO and stripped; only for binaries that become a release or dev release"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The matrix is assembled here rather than written inline because a job-level
  # `if:` cannot read the matrix context: selecting a subset any other way would
  # still spin up a runner for every excluded target.
  targets:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select targets
        id: select
        env:
          SUBSET: ${{ inputs.subset }}
        run: |
          # native: the runner can execute what it just built, so the
          #   embedded-version check below can run there.
          # ci: part of the cheaper subset ci.yml builds on every push and PR.
          # also_target, also_slug: a second target the same job cross-builds
          #   and packages. macOS Intel rides on the macOS ARM job: both need
          #   the scarce macos-latest runners, and a job GitHub finds no
          #   runner for is cancelled, holding the dev release back.
          # Linux os: the runner's glibc becomes the users' floor (GLIBC_FLOOR below).
          cat > targets.json <<'JSON'
          [
            {"name": "Linux",         "os": "ubuntu-22.04",     "target": "x86_64-unknown-linux-gnu",  "slug": "linux-x86_64",    "ext": "tar.gz", "native": true, "ci": true},
            {"name": "Windows",       "os": "windows-latest",   "target": "x86_64-pc-windows-msvc",    "slug": "windows-x86_64",  "ext": "zip",    "native": true, "ci": true},
            {"name": "macOS",         "os": "macos-latest",     "target": "aarch64-apple-darwin",      "slug": "macos-aarch64",   "ext": "tar.gz", "native": true, "ci": true,
             "also_target": "x86_64-apple-darwin", "also_slug": "macos-x86_64"},
            {"name": "Linux (ARM)",   "os": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu", "slug": "linux-aarch64",   "ext": "tar.gz", "native": true},
            {"name": "Windows (ARM)", "os": "windows-latest",   "target": "aarch64-pc-windows-msvc",   "slug": "windows-aarch64", "ext": "zip"}
          ]
          JSON
          case "$SUBSET" in
            all) INCLUDE=$(jq -c '.' targets.json) ;;
            # CI's smoke build skips the second targets.
            ci)  INCLUDE=$(jq -c '[.[] | select(.ci) | del(.also_target, .also_slug)]' targets.json) ;;
            *)
              echo "::error::unknown subset '$SUBSET'; expected 'all' or 'ci'"
              exit 1
              ;;
          esac
          echo "Building: $(jq -r '[.[] | .slug, (.also_slug // empty)] | join(", ")' <<<"$INCLUDE")"
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  # The docs every archive carries, rendered once here rather than on each
  # runner, which would need pandoc on all three OSes. Runs for CI too: a user
  # doc linking a missing file fails the push rather than the next nightly.
  docs:
    name: Package docs
    runs-on: ubuntu-latest
    # A hung runner otherwise holds the job for GitHub's 6 h default; the
    # slowest job so far took 15 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - uses: dtolnay/rust-toolchain@stable
      # The licences of the code compiled into the binaries, configured in
      # scripts/third-party-licenses.toml, as the body of the page
      # package-docs.py renders. A pinned release binary rather than cargo
      # install: every build job waits on this one.
      - name: Generate the third-party licences
        env:
          CARGO_ABOUT_VERSION: "0.9.2"
          CARGO_ABOUT_SHA256: "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af"
        run: |
          NAME="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          # Verified before extraction, as actionlint is in ci.yml.
          curl -sSLfo cargo-about.tar.gz \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${NAME}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  cargo-about.tar.gz" | sha256sum --check --strict
          tar xzf cargo-about.tar.gz "${NAME}/cargo-about"
          cargo fetch --locked
          "${NAME}/cargo-about" generate --workspace --frozen --fail \
            -c scripts/third-party-licenses.toml scripts/third-party-licenses.hbs \
            -o third-party-licenses.html 2> cargo-about.log || { cat cargo-about.log; exit 1; }
          cat cargo-about.log
          # A clarification whose checksum no longer matches is only a warning,
          # and the crate silently falls back to its metadata licence.
          if grep -q WARN cargo-about.log; then
            echo "::error::cargo-about warned; see the log above and scripts/third-party-licenses.toml"
            exit 1
          fi
      - name: Assemble the user docs
        run: python3 scripts/package-docs.py package-docs third-party-licenses.html
      - uses: actions/upload-artifact@v7
        if: inputs.upload-artifacts
        with:
          name: package-docs
          path: package-docs/

  build:
    name: Build (${{ matrix.name }})
    needs: [targets, docs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ARCHIVE: ${{ inputs.archive-prefix }}-${{ matrix.slug }}
      # The second target's archive, when the entry has one.
      ALSO_ARCHIVE: ${{ matrix.also_slug && format('{0}-{1}', inputs.archive-prefix, matrix.also_slug) || '' }}
    strategy:
      # One broken target should not hide the state of the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.also_target && format(',{0}', matrix.also_target) || '' }}

      # Off by default: release and nightly builds are unattended, and the 10 GB
      # repository cache is worth more to the CI call, whose caches decide
      # pull-request turnaround. See docs/development.md. The image is in the
      # key because rust-cache's own key names only the OS family: C objects
      # that build scripts compiled on another image's glibc headers would be
      # reused and fail to link (glibc 2.38's __isoc23_* symbols on 22.04).
      - uses: Swatinem/rust-cache@v2
        if: inputs.cache
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev

      # A build whose commit matches no release would read every nightly as
      # newer, so only binaries that are published ask; see docs/development.md.
      - name: Build
        env:
          DMM_PUBLISHED_BUILD: ${{ inputs.published && '1' || '' }}
          # The workspace's release profile is incremental for local rebuilds;
          # every binary CI builds gets release's usual settings instead.
          # Published binaries are also optimised as one unit across all
          # crates (fat LTO) and stripped of symbols, which takes about 38%
          # off the Linux pair at the same opt-level; the smoke build skips
          # both, as the whole-program pass reruns on every push.
          CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.published && '1' || '16' }}
          CARGO_PROFILE_RELEASE_LTO: ${{ inputs.published && 'fat' || 'false' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ inputs.published && 'symbols' || 'debuginfo' }}
        run: >
          cargo build --workspace --release --target ${{ matrix.target }}
          ${{ matrix.also_target && format('--target {0}', matrix.also_target) || '' }}

      # A newer runner, or a dependency calling a newer glibc function, would
      # otherwise raise the floor silently and the binaries would fail to start
      # on older distributions. The loader enforces the version references, not
      # the symbols: a weak symbol still adds a hard reference unless the linker
      # flags it weak (0x02), which bfd, gold and mold don't.
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        env:
          GLIBC_FLOOR: "2.35"
        run: |
          for bin in dmm-cli dmm-gui; do
            NEED=$(objdump -p "target/${{ matrix.target }}/release/$bin" \
              | sed -n '/Version References/,$p' \
              | awk '$4 ~ /^GLIBC_[0-9.]+$/ && $2 != "0x02" {print substr($4,7)}' \
              | sort -uV | tail -1)
            if [ -z "$NEED" ]; then
              echo "::error::found no GLIBC version references in $bin"
              exit 1
            fi
            echo "$bin needs glibc $NEED"
            if ! printf '%s\n' "$NEED" "$GLIBC_FLOOR" | sort -V -C; then
              echo "::error::$bin needs glibc $NEED, newer than the $GLIBC_FLOOR floor"
              exit 1
            fi
          done

      # build.rs only re-runs when .git/HEAD changes, so a bad incremental state
      # could ship a binary reporting the wrong commit -- which would quietly
      # defeat the point of dev builds. Also catches a binary that cannot start.
      - name: Verify embedded version
        if: matrix.native
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/dmm-cli"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Guard the assignment: under set -e a binary that cannot start would
          # abort the step here, so the annotation below would never be printed.
          if ! OUT=$("$BIN" --version); then
            echo "::error::dmm-cli --version exited non-zero; the binary does not run"
            exit 1
          fi
          echo "dmm-cli --version -> $OUT"
          if [ -z "$OUT" ]; then
            echo "::error::dmm-cli --version printed nothing"
            exit 1
          fi
          # dmm_shared::help::version_string only appends the commit on -dev
          # versions, so a tagged release legitimately has no hash to check.
          case "$OUT" in
            *-dev*)
              case "$OUT" in
                *"$SHORT_SHA"*) echo "Dev version carries the build commit $SHORT_SHA." ;;
                *)
                  echo "::error::dmm-cli --version reported '$OUT', which does not carry the build commit $SHORT_SHA"
                  exit 1
                  ;;
              esac
              ;;
            *) echo "Release version, no commit hash expected." ;;
          esac

      # README, LICENSE, the third-party licences, the user docs and their
      # images, from the docs job.
      - uses: actions/download-artifact@v8
        if: inputs.upload-artifacts
        with:
          name: package-docs
          path: ${{ env.ARCHIVE }}

      - name: Package (Linux)
        if: inputs.upload-artifacts && runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/dmm-cli "$ARCHIVE/"
          cp target/${{ matrix.target }}/release/dmm-gui "$ARCHIVE/"
          cp -r udev "$ARCHIVE/"
          tar czf "$ARCHIVE.${{ matrix.ext }}" "$ARCHIVE/"

      - name: Package (macOS)
        if: inputs.upload-artifacts && runner.os == 'macOS'
        env:
          ALSO_TARGET: ${{ matrix.also_target }}
        run: |
          # The second archive takes a copy of the docs before the first
          # archive's binaries go in.
          if [ -n "$ALSO_ARCHIVE" ]; then
            cp -R "$ARCHIVE" "$ALSO_ARCHIVE"
            cp "target/$ALSO_TARGET/release/dmm-cli" "$ALSO_ARCHIVE/"
            cp "target/$ALSO_TARGET/release/dmm-gui" "$ALSO_ARCHIVE/"
            tar czf "$ALSO_ARCHIVE.${{ matrix.ext }}" "$ALSO_ARCHIVE/"
          fi
          cp target/${{ matrix.target }}/release/dmm-cli "$ARCHIVE/"
          cp target/${{ matrix.target }}/release/dmm-gui "$ARCHIVE/"
          tar czf "$ARCHIVE.${{ matrix.ext }}" "$ARCHIVE/"

      - name: Package (Windows)
        if: inputs.upload-artifacts && runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/dmm-cli.exe "$ARCHIVE/"
          cp target/${{ matrix.target }}/release/dmm-gui.exe "$ARCHIVE/"
          7z a "$ARCHIVE.${{ matrix.ext }}" "$ARCHIVE/"

      - name: Upload artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.${{ matrix.ext }}

      - name: Upload the second target's artifact
        if: inputs.upload-artifacts && matrix.also_slug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ALSO_ARCHIVE }}
          path: ${{ env.ALSO_ARCHIVE }}.${{ matrix.ext }}
