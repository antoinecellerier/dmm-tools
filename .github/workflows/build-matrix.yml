# Shared release-binary build, called by release.yml (tagged releases) and
# dev-build.yml (nightly prereleases). Keeping both on one matrix means a
# nightly build exercises the exact packaging path that later cuts a release,
# so a break surfaces the next morning instead of at tag time.
#
# Deliberately no Swatinem/rust-cache here: these builds are unattended and the
# 10 GB repository cache is worth more to ci.yml, whose caches decide PR
# turnaround. See docs/development.md.
name: Build binaries

on:
  workflow_call:
    inputs:
      archive-prefix:
        description: "Base name for the archives, e.g. dmm-tools or dmm-tools-dev-abc1234"
        type: string
        default: dmm-tools

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: ${{ inputs.archive-prefix }}-${{ matrix.slug }}
    strategy:
      # One broken target should not hide the state of the other five.
      fail-fast: false
      matrix:
        include:
          # `native: true` means the runner can execute what it just built, so
          # the embedded-version check below can run.
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            ext: tar.gz
            native: true
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            ext: zip
            native: true
          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-aarch64
            ext: tar.gz
            native: true
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            slug: macos-x86_64
            ext: tar.gz
          - name: Linux (ARM)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-aarch64
            ext: tar.gz
            native: true
          - name: Windows (ARM)
            os: windows-latest
            target: aarch64-pc-windows-msvc
            slug: windows-aarch64
            ext: zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      # build.rs only re-runs when .git/HEAD changes, so a bad incremental state
      # could ship a binary reporting the wrong commit -- which would quietly
      # defeat the point of dev builds. Also catches a binary that cannot start.
      - name: Verify embedded version
        if: matrix.native
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/dmm-cli"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Guard the assignment: under set -e a binary that cannot start would
          # abort the step here, so the annotation below would never be printed.
          if ! OUT=$("$BIN" --version); then
            echo "::error::dmm-cli --version exited non-zero; the binary does not run"
            exit 1
          fi
          echo "dmm-cli --version -> $OUT"
          if [ -z "$OUT" ]; then
            echo "::error::dmm-cli --version printed nothing"
            exit 1
          fi
          # binary_help::version_string only appends the commit on -dev
          # versions, so a tagged release legitimately has no hash to check.
          case "$OUT" in
            *-dev*)
              case "$OUT" in
                *"$SHORT_SHA"*) echo "Dev version carries the build commit $SHORT_SHA." ;;
                *)
                  echo "::error::dmm-cli --version reported '$OUT', which does not carry the build commit $SHORT_SHA"
                  exit 1
                  ;;
              esac
              ;;
            *) echo "Release version, no commit hash expected." ;;
          esac

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$ARCHIVE"
          cp target/${{ matrix.target }}/release/dmm-cli "$ARCHIVE/"
          cp target/${{ matrix.target }}/release/dmm-gui "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/"
          cp -r udev "$ARCHIVE/"
          cp -r docs "$ARCHIVE/"
          tar czf "$ARCHIVE.${{ matrix.ext }}" "$ARCHIVE/"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$ARCHIVE"
          cp target/${{ matrix.target }}/release/dmm-cli "$ARCHIVE/"
          cp target/${{ matrix.target }}/release/dmm-gui "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/"
          cp -r docs "$ARCHIVE/"
          tar czf "$ARCHIVE.${{ matrix.ext }}" "$ARCHIVE/"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$ARCHIVE"
          cp target/${{ matrix.target }}/release/dmm-cli.exe "$ARCHIVE/"
          cp target/${{ matrix.target }}/release/dmm-gui.exe "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/"
          cp -r docs "$ARCHIVE/"
          7z a "$ARCHIVE.${{ matrix.ext }}" "$ARCHIVE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.${{ matrix.ext }}
