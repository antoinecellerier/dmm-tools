name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload release artifacts'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so a new actionlint release cannot fail an unrelated pull
      # request. shellcheck ships on the runner image, so actionlint lints the
      # bash inside run: blocks as well as the workflow syntax itself.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          # Verified before extraction: the tarball is executed straight after,
          # so a replaced release asset would otherwise run arbitrary code here.
          curl -sSLfo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          # Surfaces findings as annotations on the pull-request diff rather
          # than only in the job log. The matcher tolerates -color's escapes.
          echo "::add-matcher::.github/actionlint-matcher.json"
          ./actionlint -color

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dmm-tools-linux-x86_64
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dmm-tools-windows-x86_64
          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: dmm-tools-macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows' && inputs.upload_artifacts
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/dmm-cli staging/
          cp target/${{ matrix.target }}/release/dmm-gui staging/
          cp README.md LICENSE staging/
          cp -r udev staging/ || true

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows' && inputs.upload_artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/dmm-cli.exe staging/
          cp target/${{ matrix.target }}/release/dmm-gui.exe staging/
          cp README.md LICENSE staging/

      - name: Upload artifact
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging/
