name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload release artifacts'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libudev-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so a new actionlint release cannot fail an unrelated pull
      # request. shellcheck ships on the runner image, so actionlint lints the
      # bash inside run: blocks as well as the workflow syntax itself.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          # Verified before extraction: the tarball is executed straight after,
          # so a replaced release asset would otherwise run arbitrary code here.
          curl -sSLfo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          # Surfaces findings as annotations on the pull-request diff rather
          # than only in the job log. The matcher tolerates -color's escapes.
          echo "::add-matcher::.github/actionlint-matcher.json"
          ./actionlint -color

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-deny
      # Built from source rather than pulled from a prebuilt action, so the
      # workflow keeps to the actions it already trusts; rust-cache keeps the
      # binary in ~/.cargo/bin, and cargo install skips an unchanged version.
      - run: cargo install --locked cargo-deny
      # Advisories, the deny.toml licence allow-list, wildcard requirements and
      # unknown registries. cargo-deny reads Cargo.lock; it builds nothing.
      - run: cargo deny check

  # The smoke build comes from the shared release matrix, so what CI compiles
  # cannot drift from what a release ships. `subset: ci` keeps the other three
  # release targets out of pull-request builds, and nothing is packaged unless a
  # manual dispatch asks for it — a push or pull request uploads nothing.
  build:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml
    with:
      subset: ci
      cache: true
      upload-artifacts: ${{ inputs.upload_artifacts || false }}
