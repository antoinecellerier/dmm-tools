name: Release

# A push event otherwise titles the run after the commit message, so the
# version only shows up because the release commit happens to be named
# "Release vX.Y.Z". State it outright, and say plainly when a manual dispatch
# is only a build check that publishes nothing.
run-name: >-
  ${{ github.ref_type == 'tag'
  && format('Release {0}', github.ref_name)
  || format('Build check ({0})', github.ref_name) }}

on:
  push:
    tags:
      - "v*"
  # Dispatching against a branch is a build-only smoke test: the release job
  # below is gated on a v* ref, so it builds all six targets and publishes
  # nothing. Dispatching against a tag is not — that gate passes, and the job
  # overwrites that release's assets and notes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag whose version the workspace does not carry would publish binaries and
  # release notes naming a different one, and the tag cannot be corrected once
  # people have fetched it. Cheaper to catch here than after six builds.
  check-version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare the tag with the workspace version
        # A branch dispatch is a build-only smoke test: no tag to compare, and
        # gating the whole job would skip the build that depends on it.
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # The root manifest is virtual, so there is no root package to read:
          # every member inherits version.workspace, and all of them are checked
          # here, which also catches one that stopped inheriting.
          MISMATCH=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg v "$TAG_VERSION" \
                '.packages[] | select(.version != $v) | "\(.name) \(.version)"')
          if [ -n "$MISMATCH" ]; then
            # Annotations stop at the first newline, so keep it to one line.
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml: ${MISMATCH//$'\n'/, }. Set version = \"${TAG_VERSION}\" in the workspace manifest, then re-tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches the workspace version ${TAG_VERSION}."

  build:
    needs: check-version
    permissions:
      contents: read
    uses: ./.github/workflows/build-matrix.yml

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The section heading is "## vX.Y.Z", optionally followed by
          # " — tagline". The tagline becomes the release title; the body is
          # everything up to the next "## v" heading, so a summary paragraph
          # placed right under the heading opens the release notes.
          HEADING=$(grep -m1 -E "^## v${VERSION//./\\.}( — .+)?$" CHANGELOG.md) || {
            echo "::error::CHANGELOG.md has no '## v${VERSION}' section"
            exit 1
          }
          TAGLINE="${HEADING#"## v${VERSION}"}"
          TAGLINE="${TAGLINE# — }"
          echo "name=v${VERSION}${TAGLINE:+ — ${TAGLINE}}" >> "$GITHUB_OUTPUT"
          awk -v heading="$HEADING" '$0 == heading {found=1; next} /^## v/{if(found) exit} found' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.changelog.outputs.name }}
          body_path: release_notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
