# Weekly dependency pull requests. Minor and patch bumps are grouped into one
# PR per ecosystem so routine updates cost a single review; a major bump still
# arrives on its own, because it is the one that needs reading.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # egui and its companion crates release in lockstep, and one built on a
      # different egui than the rest fails to compile, so they move together.
      egui:
        patterns: ["eframe", "egui*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # dmm-gui's system font lookup uses the fontique and skrifa that eframe
      # depends on; a newer one is a second copy, so they move with egui.
      - dependency-name: fontique
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: skrifa
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
