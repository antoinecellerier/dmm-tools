[workspace]
members = [
    "crates/dmm-lib",
    "crates/dmm-shared",
    "crates/dmm-cli",
    "crates/dmm-gui",
]
resolver = "2"

[workspace.package]
version = "0.11.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
directories = "6"
tempfile = "3"

# The coding rules in CLAUDE.md, enforced by the compiler; clippy.toml lets
# tests unwrap.
[workspace.lints.rust]
# Warnings fail every build, test and clippy run of our crates. Set here
# rather than as rustflags in .cargo/config.toml, which reached dependencies
# too and doubled in a worktree nested in the checkout (cargo appends each
# config's flags), so no worktree could reuse another's dependency builds.
warnings = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
allow_attributes_without_reason = "warn"

# Dependencies without debuginfo, which takes about a third off target/; our
# own crates keep full debuginfo for backtraces and debuggers. opt-level 1
# runs egui and the other dependencies fast enough to take the test run
# from about 20 s to under 10 s; it costs about 4 more minutes per cold
# build of them. opt-level 2 gained nothing over 1.
[profile.dev.package."*"]
debug = false
opt-level = 1

# Incremental locally, which also brings cargo's default of 256 codegen
# units: after an edit --release rebuilds dmm-cli in about 5 s instead of
# about 60 s, for slightly slower code. Published binaries are built without
# it: the Build step in .github/workflows/build-matrix.yml turns incremental
# off, and for releases and dev builds adds fat LTO and strips the symbols.
[profile.release]
incremental = true
