[workspace]
members = [
    "crates/dmm-lib",
    "crates/dmm-settings",
    "crates/dmm-cli",
    "crates/dmm-gui",
]
resolver = "2"

[workspace.package]
version = "0.7.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
serde_yaml_ng = "0.10"
directories = "6"
