[workspace]
members = [
    "crates/dmm-lib",
    "crates/dmm-shared",
    "crates/dmm-cli",
    "crates/dmm-gui",
]
resolver = "2"

[workspace.package]
version = "0.10.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
directories = "6"
tempfile = "3"

# The coding rules in CLAUDE.md, enforced by the compiler; clippy.toml lets
# tests unwrap.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
