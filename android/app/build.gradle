plugins {
    id 'com.android.application'
}

// btleplug's Java half, taken from the crate version Cargo.lock holds so the
// classes always match the Rust that calls them. Nothing of it is copied or
// built into the repository.
def run = { String... command ->
    providers.exec {
        workingDir rootDir.parentFile
        commandLine command
    }.standardOutput.asText.get().trim()
}
def cargoPackages = new groovy.json.JsonSlurper()
    .parseText(run('cargo', 'metadata', '--format-version', '1', '--locked')).packages
def btleplugJava = {
    def crate = cargoPackages.find { it.name == 'btleplug' }
    if (crate == null) {
        throw new GradleException('btleplug is not in the cargo workspace')
    }
    new File(new File(crate.manifest_path).parentFile, 'src/droidplug/java/src/main/java')
}()

// The version the desktop binaries print: the workspace's, with the commit
// on a development version.
def appVersion = {
    def version = cargoPackages.find { it.name == 'dmm-android' }.version
    version.contains('-dev') ? "$version (${run('git', 'rev-parse', '--short', 'HEAD')})" : version
}()
// Android installs a package over another only when this number is not
// lower. The commit's time, in minutes, rises from one published build to
// the next and is the same wherever the commit is built.
def appVersionCode = run('git', 'log', '-1', '--format=%ct').toLong().intdiv(60).toInteger()

// The launcher icon is the desktop one, copied in at build time rather than
// kept twice in the repository: as the icon itself for Android 7, and as the
// drawing res/mipmap-anydpi-v26/ic_launcher.xml places on its background.
def iconRes = new File(buildDir, 'generated/icon-res')
def copyIcon = tasks.register('copyIcon', Copy) {
    def icon = new File(rootDir.parentFile, 'assets/icon-256.png')
    into new File(iconRes, 'mipmap')
    from(icon) { rename { 'ic_launcher.png' } }
    from(icon) { rename { 'ic_launcher_art.png' } }
}
tasks.named('preBuild') { dependsOn copyIcon }

android {
    namespace 'io.github.antoinecellerier.dmmtools'
    compileSdk 34
    // The NDK the Rust half is linked with, which also strips the library:
    // the version scripts/android-build.sh names.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'io.github.antoinecellerier.dmmtools'
        // btleplug's Android backend needs API 24.
        minSdk 24
        // Not 35: it draws under the system bars, which egui does not
        // account for on Android (egui issue 7748).
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        // Signed with the debug key, so the build installs on a phone for a
        // test. A published APK is signed again, with the project's key, by
        // scripts/android-sign.sh.
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            java.srcDirs += btleplugJava
            res.srcDirs += iconRes
        }
    }
}
