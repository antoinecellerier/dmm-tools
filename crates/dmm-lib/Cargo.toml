[package]
name = "dmm-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Library for communicating with digital multimeters via CP2110, CH9329 and CH9325 HID bridges, Brymen's BU-86X cable and Bluetooth LE"

[dependencies]
thiserror = "2"
log.workspace = true
# Bluetooth only: BlueZ/CoreBluetooth/WinRT behind one API, driven by a
# current-thread runtime the transport owns (see transport/ble/mod.rs).
btleplug = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
futures = { version = "0.3", optional = true }

# Windows only: the connection-parameter request btleplug makes but does not
# keep (transport/ble/winrt.rs). The version btleplug already uses, so it adds
# no build; move it when btleplug moves.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Foundation"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", features = ["linux-static-hidraw"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6" }

[features]
default = ["bluetooth"]
bluetooth = ["dep:btleplug", "dep:tokio", "dep:futures", "dep:windows"]
test-support = []

[dev-dependencies]
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
