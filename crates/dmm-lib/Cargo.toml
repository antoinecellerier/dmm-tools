[package]
name = "dmm-lib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Library for communicating with UNI-T and Voltcraft digital multimeters via CP2110, CH9329, and CH9325 HID bridges"

[dependencies]
thiserror = "2"
log.workspace = true
# Bluetooth only: BlueZ/CoreBluetooth/WinRT behind one API, driven by a
# current-thread runtime the transport owns (see transport/ble/mod.rs).
btleplug = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
futures = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", features = ["linux-static-hidraw"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2.6" }

[features]
default = ["bluetooth"]
bluetooth = ["dep:btleplug", "dep:tokio", "dep:futures"]
test-support = []

[dev-dependencies]
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
