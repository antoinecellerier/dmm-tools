[package]
name = "dmm-shared"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What dmm-cli and dmm-gui share and dmm-lib must not carry: settings schema, durable writes, export shapes and names, log setup"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
serde.workspace = true
# The field order of an exported reading is part of what both binaries write,
# so it must not depend on which of them is in the build.
serde_json = { workspace = true, features = ["preserve_order"] }
directories.workspace = true
chrono.workspace = true
env_logger.workspace = true
log.workspace = true

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
