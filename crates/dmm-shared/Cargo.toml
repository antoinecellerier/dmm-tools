[package]
name = "dmm-shared"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What dmm-cli and dmm-gui share and dmm-lib must not carry: settings schema, durable writes, export shapes and names, log setup"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] } # the saved view goes in and out as the GUI wrote it
directories.workspace = true
chrono.workspace = true
csv.workspace = true
env_logger.workspace = true
log.workspace = true
fluent-bundle = "0.16.0"
sys-locale = "0.3.2"
unic-langid = "0.9.6"

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
