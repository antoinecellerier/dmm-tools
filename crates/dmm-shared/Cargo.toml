[package]
name = "dmm-shared"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What dmm-cli and dmm-gui share and dmm-lib must not carry: settings schema, durable writes, export shapes and names, log setup"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] } # the saved view goes in and out as the GUI wrote it
directories.workspace = true
chrono.workspace = true
csv.workspace = true
env_logger.workspace = true
log.workspace = true
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0" # parses and writes Fluent source; already in the tree for fluent-bundle
sys-locale = "0.3.2"
unic-langid = "0.9.6"

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
hidapi = { version = "2.6", default-features = false } # builds an `Error::Hid` for the error tests
intl_pluralrules = "7.0.2" # the plural forms a translation must have; fluent-bundle already selects with it
tempfile.workspace = true

[features]
# The message scan the binaries' tests run over their sources (l10n::check).
test-support = []

[lints]
workspace = true
