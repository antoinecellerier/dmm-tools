[package]
name = "dmm-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for UNI-T and Voltcraft digital multimeters"

[[bin]]
name = "dmm-cli"
path = "src/main.rs"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
dmm-shared = { path = "../dmm-shared" }
clap.workspace = true
clap_complete = "4"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] } # `get --format json` leads with the header fields
chrono.workspace = true
ctrlc = "3"
log.workspace = true
console = "0.16"
serde_yaml_ng.workspace = true
csv.workspace = true

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
