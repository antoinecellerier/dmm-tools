[package]
name = "dmm-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for USB and Bluetooth digital multimeters"

[[bin]]
name = "dmm-cli"
path = "src/main.rs"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
dmm-shared = { path = "../dmm-shared" }
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] } # `get --format json` leads with the header fields
chrono.workspace = true
ctrlc = "3"
log.workspace = true
console = "0.16"
serde_yaml_ng.workspace = true
csv.workspace = true

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
# Only to build the HID error a pulled cable raises, in a test; no features
# beyond the ones dmm-lib already enables.
hidapi = { version = "2.6", default-features = false }
