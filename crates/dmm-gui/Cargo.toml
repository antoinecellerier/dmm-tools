[package]
name = "dmm-gui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI application for USB and Bluetooth digital multimeters"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
dmm-shared = { path = "../dmm-shared" }
eframe = { version = "0.36", features = ["glow", "wgpu"] }
egui_commonmark = "0.25"
egui_plot = "0.37"
raw-window-handle = "0.6"
chrono.workspace = true
csv.workspace = true
rfd = "0.17"
clap.workspace = true
clap_complete.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
ureq = { version = "3", default-features = false, features = ["platform-verifier", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
default = ["update-check"]
# The daily request for a newer release, the GUI's only network access. Without
# it no HTTP or TLS code is built in and the Settings row never shows.
update-check = ["dep:ureq", "dep:rustls"]

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
