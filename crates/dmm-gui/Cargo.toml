[package]
name = "dmm-gui"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI application for USB and Bluetooth digital multimeters"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
dmm-shared = { path = "../dmm-shared" }
eframe = { version = "0.37", features = ["glow", "wgpu"] }
# egui 0.37 stopped bundling the emoji fonts that draw our symbols (⚠ ✔ ↗ ▶ ⊞);
# without them each OS draws its own, colour emoji included.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26"
# The system font lookup in app/system_fonts.rs, adapted from
# egui_system_font_provider 0.37 (already in the tree through eframe).
# fontique and skrifa stay on the versions eframe uses, so they are built
# once (dependabot ignores their minor bumps): move them with egui.
# On an egui update, check whether upstream now asks the language's own
# font first (docs/future-improvements.md, "Localization follow-ups").
fontique = "0.11"
skrifa = "0.44"
sys-locale = "0.3"
unicode-script = "0.5"
egui_plot = "0.38"
raw-window-handle = "0.6"
chrono.workspace = true
csv.workspace = true
rfd = "0.17"
clap.workspace = true
clap_complete.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
ureq = { version = "3", default-features = false, features = ["platform-verifier", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

# Detaches from the console Windows opens for an Explorer launch (main.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[features]
default = ["update-check"]
# The daily request for a newer release, the GUI's only network access. Without
# it no HTTP or TLS code is built in and the Settings row never shows.
update-check = ["dep:ureq", "dep:rustls"]

[dev-dependencies]
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
dmm-shared = { path = "../dmm-shared", features = ["test-support"] }

[lints]
workspace = true
