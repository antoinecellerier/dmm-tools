[package]
name = "dmm-android"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Experimental Android build of dmm-gui: the shared library its activity loads"

# The library `android/` packages into the APK. Empty on every other target,
# so a desktop build of the workspace compiles nothing here.
[lib]
crate-type = ["cdylib"]

# btleplug and jni at the versions dmm-lib's Bluetooth transport and
# android-activity already use: one copy of each, initialised here.
[target.'cfg(target_os = "android")'.dependencies]
dmm-gui = { path = "../dmm-gui" }
dmm-lib = { path = "../dmm-lib" }
dmm-shared = { path = "../dmm-shared" }
btleplug = "0.13.3"
jni = "0.22"
android_logger = "0.15"
android_system_properties = "0.1"
log.workspace = true

[lints]
workspace = true
