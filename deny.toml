# Dependency policy, enforced by `cargo deny check` in ci.yml.

[graph]
# The six targets build-matrix.yml ships. A crate only another platform pulls
# in never reaches a user: rustls-platform-verifier's CA list for wasm32, which
# has no trust store to ask, is the case in point.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# RustSec advisories fail the check. Tolerating one means listing its id here
# with a reason saying why and what unblocks removing it again.
ignore = [
    # ttf-parser is unmaintained; it comes in via winit's client-side
    # decorations on Wayland. Unblocked when winit switches font parsers.
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit, no upgrade path" },
]

[licenses]
# Exactly the SPDX ids the current graph needs, so a dependency that drags in
# another licence fails the check instead of shipping unexamined inside a
# GPL-3.0-or-later binary. Widen this only after reading the licence, and add
# the id to scripts/third-party-licenses.toml's `accepted` too.
#
# cargo-deny reads only each crate's declared licence. Read beyond it, and
# clarified in scripts/third-party-licenses.toml: hidapi compiles in the C
# hidapi (taken under its BSD-3-Clause option), and winit uses
# wayland-protocols-plasma's LGPL-2.1-or-later blur protocol.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later", # the workspace crates themselves
    "ISC",
    "MIT",
    "MPL-2.0",         # option-ext; file-level copyleft
    "OFL-1.1",         # epaint_default_fonts, AND-ed with MIT/Apache-2.0;
                       # sctk-adwaita's Cantarell font too, undeclared
    "Ubuntu-font-1.0", # epaint_default_fonts, likewise
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicate versions are unavoidable in a graph this size and pruning them is
# churn, not safety.
multiple-versions = "allow"
# A wildcard requirement resolves to whatever was published last, which makes
# builds unreproducible. The workspace's own path dependencies carry no version
# requirement by design and are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
